name: CI

on:
  push:
    branches:
      - '**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: Frontend
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: Backend
        run: npm install

      - name: Validate backend source
        working-directory: Backend
        run: node --check src/server.js

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: Backend
        run: npm install

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      - name: Validate Vercel configuration
        run: |
          if [ ! -f "vercel.json" ]; then
            echo "❌ vercel.json not found!"
            exit 1
          fi
          echo "✅ vercel.json is present"

      - name: Validate backend API handler
        working-directory: Backend
        run: node --check api/index.js

      - name: Verify build outputs
        run: |
          if [ ! -d "Frontend/dist" ]; then
            echo "❌ Frontend dist directory not found!"
            exit 1
          fi
          echo "✅ Frontend build output verified"
          ls -lh Frontend/dist/